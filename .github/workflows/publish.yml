name: Publish packages

on:
  push:
    branches:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify packages
        run: npm run verify

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./packages/core --access public --provenance
          npm publish ./packages/parser --access public --provenance
          npm publish ./packages/async-validation --access public --provenance
          npm publish ./packages/adapter-fetch --access public --provenance
          npm publish ./packages/react --access public --provenance